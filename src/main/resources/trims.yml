spire:
  name: Spire
  title: Levitation
  passive:
    enabled: true
    name: Feather Falling
    description: You take no fall damage.
  ability:
    enabled: true
    name: Levitation Shroud
    description: All players in a 15 block radius get levitation for 10 seconds.
    cooldown: 90
    activation-time: 10
    range: 15.0

silence:
  name: Silence
  title: Invisibility
  passive:
    enabled: true
    name: Silent & Sneaky
    description: Unless a player is present in a 15 block radius around you, you are completely hidden to every player, including tablist, your character, armor, and tools you're holding. You have permanent invisibility, but glow when you enter the 15 block range. When you kill someone, your name is not revealed. Placing or breaking blocks is silent.
    appear-range: 10.0

vex:
  name: Vex
  title: Illusions
  passive:
    enabled: true
    name: Totem of Chance
    description: When you're about to die, there's a 30% chance you survive and get healed 4 hearts.
    revive-chance: 30
    heal-health: 8
  ability:
    enabled: true
    name: Crushing Fangs
    description: Summons evoker fangs in a 3x3 radius around the block you are looking at.
    cooldown: 45
    range: 10.0
    extra-damage: 14

bolt:
  name: Bolt
  title: Lightning
  passive:
    enabled: true
    name: Thundering Hits
    description: Hitting a player has a 10% chance of summoning thunder at them.
    lightning-chance: 10
  ability:
    enabled: true
    name: Lightning Strike
    description: Summon thunder at every player in a 10 block radius.
    cooldown: 120
    range: 10.0

ward:
  name: Ward
  title: Shrieking
  passive:
    enabled: true
    name: Tank
    description: You get 5 extra hearts.
    add-health: 10
  ability:
    enabled: true
    name: Sonic Boom
    description: Shoot a sonic boom towards the direction you are facing at.
    cooldown: 120
    range: 25
    damage: 15

snout:
  name: Snout
  title: Nether Alliance
  passive:
    enabled: true
    name: Piglin Commander
    description: Piglins never attack you. You can always accept or reject the result of any barter, refunding the gold if you reject.
  ability:
    enabled: true
    name: Call for Help
    description: Summons 3 piglins and a piglin brute that don't attack you, despawning after 20s.
    cooldown: 120
    activation-time: 20

eye:
  name: Eye
  title: Teleportation
  ability:
    enabled: true
    name: Ender Sight
    description: Teleport to the block you are looking at within an 80 block distance.
    cooldown: 85
    max-teleport-distance: 80
    glow-duration-ticks: 200

dune:
  name: Dune
  title: Sand
  passive:
    enabled: true
    name: Sandturation
    description: You never lose hunger.
  ability:
    enabled: true
    name: Sandstorm
    description: Summon a sand shroud inflicting any player within 10 blocks of you with blindness and slowness, while you gain speed.
    cooldown: 85
    activation-time: 5
    range: 10.0
    blindness-amplifier: 2
    slowness-amplifier: 2
    speed-amplifier: 2

sentry:
  name: Sentry
  title: Archery
  passive:
    enabled: true
    name: Noclip Arrows
    description: Each time an arrow hits you, there's an 80% chance it does no damage.
    block-chance-percent: 80
  ability:
    enabled: true
    name: Turret
    description: You fire arrows for 10 seconds at nearby players/mobs.
    cooldown: 90
    activation-time: 30
    range: 5.0
    arrow-delay-ticks: 30